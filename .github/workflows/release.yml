name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            files: |
              release/*.exe
              release/*.blockmap
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons

      - name: Build artifacts
        run: ${{ matrix.command }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
